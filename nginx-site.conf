# Poultry monitoring app — add to existing nginx config on server
# Assumes TLS is already handled by the existing nginx (Let's Encrypt / certbot)
# The frontend container listens on 127.0.0.1:3001
# Adjust server_name to your desired subdomain (e.g., poultry.tvssecurity.com)

server {
    listen 443 ssl http2;
    server_name poultry.tvssecurity.com;

    # Use the existing SSL certs (copy from your current vistock server block
    # or generate new ones for this subdomain via certbot)

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket support (live detection feed)
    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # API proxy (backend runs inside Docker network, frontend nginx handles /api/)
    # No extra config needed — the frontend container's nginx already proxies /api/ to backend:8000

    # Frigate HLS streams (if accessed directly)
    location /api/frigate/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name poultry.tvssecurity.com;
    return 301 https://$host$request_uri;
}
