# Production override — locks down dev-exposed ports and sets production defaults.
# Use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# All secrets are read from .env file (no Docker Swarm required).
services:
  postgres:
    ports: []  # Remove host port — internal only

  influxdb:
    ports: []

  redis:
    ports: []

  mosquitto:
    ports:
      - "1883:1883"

  backend:
    ports: []
    environment:
      CORS_ORIGINS: https://${DOMAIN}
      COOKIES_SECURE: "true"
      LOG_LEVEL: WARNING
      DATABASE_URL: postgresql+asyncpg://poultry:${POSTGRES_PASSWORD}@postgres:5432/poultry

  frontend:
    ports:
      - "127.0.0.1:3001:80"
    environment:
      VITE_API_URL: https://${DOMAIN}

  backup:
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
